<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Tenants</h2>
    <a href="/admin/tenants/new" class="btn btn-primary">
        <i class="bi bi-plus-circle me-1"></i>Create New Tenant
    </a>
</div>

<div class="card">
    <div class="card-body">
        {{if .Tenants}}
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Domain</th>
                        <th>Issuer</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {{range .Tenants}}
                    <tr>
                        <td><code>{{.ID}}</code></td>
                        <td>{{.Name}}</td>
                        <td>{{.Domain}}</td>
                        <td><small class="text-muted">{{.Config.Issuer}}</small></td>
                        <td>
                            <a href="/admin/tenants/edit?id={{.ID}}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil me-1"></i>Edit
                            </a>
                        </td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>
        {{else}}
        <div class="text-center text-muted py-5">
            <i class="bi bi-building" style="font-size: 3rem;"></i>
            <p class="mt-3">No tenants found</p>
        </div>
        {{end}}
    </div>
</div>
