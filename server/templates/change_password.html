<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password – {{.TenantName}}</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        /* HTMX loading indicator */
        .htmx-indicator {
            display: none;
        }

        .htmx-request .htmx-indicator {
            display: inline-block;
        }

        /* Prevent yellow autofill background */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: inherit !important;
        }

        /* Prevent yellow background for invalid autofilled fields */
        input.is-invalid:-webkit-autofill,
        input.is-invalid:-webkit-autofill:hover,
        input.is-invalid:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 30px var(--bs-form-invalid-color) inset !important;
            box-shadow: 0 0 0 30px var(--bs-form-invalid-color) inset !important;
        }

        /* Disable Bootstrap's default validation icons - we use our own */
        .form-control.is-valid,
        .form-control.is-invalid {
            background-image: none !important;
            padding-right: 0.75rem !important;
        }

        /* Hide feedback div when empty */
        #password-feedback:empty {
            display: none !important;
        }
    </style>
    <link rel="icon" href="data:,">
</head>

<body class="bg-white">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                <div class="bg-white border rounded-4 shadow p-4 p-md-5">
                    <div class="text-center mb-3">
                        <i class="bi bi-shield-lock text-warning" style="font-size: 3rem;"></i>
                        <h1 class="h4 fw-semibold mb-1 mt-2">Password Change Required</h1>
                        <p class="text-muted mb-0">Please choose a new password to continue</p>
                    </div>

                    {{if .Error}}
                    <div class="alert alert-danger d-flex align-items-center alert-dismissible fade show mb-4"
                        role="alert" aria-live="polite">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <div class="flex-grow-1">{{.Error}}</div>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {{end}}

                    <form id="change-password-form" method="POST" action="/auth/change-password"
                        hx-post="/auth/change-password" hx-target="#change-password-form" hx-swap="outerHTML"
                        hx-indicator="#change-spinner">

                        <div class="mb-3">
                            <div class="d-flex align-items-center gap-2">
                                <div class="form-floating flex-grow-1">
                                    <input type="password" class="form-control" id="new_password" name="new_password"
                                        placeholder="New password" required autofocus hx-post="/api/validate-password"
                                        hx-trigger="blur" hx-target="#password-feedback" hx-swap="innerHTML">
                                    <label for="new_password">New password</label>
                                </div>
                                <span id="validation-icon" class="fs-5"
                                    style="width: 1.5rem; display: inline-block;"></span>
                            </div>
                            <div id="password-feedback" class="invalid-feedback d-block small"></div>
                        </div>
                        <div class="mb-3">
                            <div class="d-flex align-items-center gap-2">
                                <div class="form-floating flex-grow-1">
                                    <input type="password" class="form-control" id="confirm_password"
                                        name="confirm_password" placeholder="Confirm new password" required>
                                    <label for="confirm_password">Confirm new password</label>
                                </div>
                                <span id="confirm-validation-icon" class="fs-5"
                                    style="width: 1.5rem; display: inline-block;"></span>
                            </div>
                            <div id="confirm-feedback" class="invalid-feedback d-block small"></div>
                        </div>

                        <div class="alert alert-info d-flex align-items-start" role="alert">
                            <i class="bi bi-info-circle-fill me-2 mt-1"></i>
                            <div class="small">
                                <strong>Password requirements:</strong>
                                <ul class="mb-0 ps-3">
                                    <li>At least 8 characters long</li>
                                    <li>Must contain uppercase and lowercase letters</li>
                                    <li>Must contain at least one number</li>
                                </ul>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" id="submit-button" class="btn btn-primary btn-lg" disabled>
                                <span class="htmx-indicator" id="change-spinner">
                                    <span class="spinner-border spinner-border-sm me-2" role="status"
                                        aria-hidden="true"></span>
                                </span>
                                Update password
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/bootstrap.bundle.min.js"></script>
    <script src="/js/htmx.min.js"></script>
    <script>
        let passwordValid = false;
        let confirmPasswordValid = false;

        // Update submit button state
        function updateSubmitButton() {
            const submitButton = document.getElementById('submit-button');
            submitButton.disabled = !(passwordValid && confirmPasswordValid);
        }

        // Handle password validation visual feedback after HTMX request completes
        document.getElementById('new_password').addEventListener('htmx:afterRequest', function (evt) {
            const icon = document.getElementById('validation-icon');
            const feedback = document.getElementById('password-feedback');
            const password = this.value;

            // Check if feedback contains error (text-danger)
            if (feedback.innerHTML.includes('text-danger')) {
                icon.innerHTML = '<i class="bi bi-x-circle-fill text-danger"></i>';
                passwordValid = false;
            } else if (feedback.innerHTML === '' && password) {
                // Only show green tick if password has value and validation passed
                icon.innerHTML = '<i class="bi bi-check-circle-fill text-success"></i>';
                passwordValid = true;
            }
            updateSubmitButton();
        });

        // Clear validation styling when user starts typing
        document.getElementById('new_password').addEventListener('input', function () {
            document.getElementById('validation-icon').innerHTML = '';
            document.getElementById('password-feedback').innerHTML = '';
            passwordValid = false;
            updateSubmitButton();
        });

        // Validate confirmation password matches
        document.getElementById('confirm_password').addEventListener('blur', function () {
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = this.value;
            const icon = document.getElementById('confirm-validation-icon');
            const feedback = document.getElementById('confirm-feedback');

            if (!confirmPassword) {
                icon.innerHTML = '';
                feedback.innerHTML = '';
                confirmPasswordValid = false;
                updateSubmitButton();
                return;
            }

            if (newPassword !== confirmPassword) {
                icon.innerHTML = '<i class="bi bi-x-circle-fill text-danger"></i>';
                feedback.innerHTML = '<span class="text-danger">Passwords do not match</span>';
                confirmPasswordValid = false;
            } else if (newPassword && passwordValid) {
                icon.innerHTML = '<i class="bi bi-check-circle-fill text-success"></i>';
                feedback.innerHTML = '';
                confirmPasswordValid = true;
            } else {
                confirmPasswordValid = false;
            }
            updateSubmitButton();
        });

        // Clear confirmation validation when typing
        document.getElementById('confirm_password').addEventListener('input', function () {
            document.getElementById('confirm-validation-icon').innerHTML = '';
            document.getElementById('confirm-feedback').innerHTML = '';
            confirmPasswordValid = false;
            updateSubmitButton();
        });

        // Prevent tabbing out if password is invalid
        document.getElementById('new_password').addEventListener('keydown', function (e) {
            if (e.key === 'Tab' && this.value && !passwordValid) {
                // Only prevent if there's actual error feedback showing
                const feedback = document.getElementById('password-feedback');
                if (feedback.innerHTML.includes('text-danger')) {
                    e.preventDefault();
                    this.focus();
                }
            }
        });

        // Prevent form submission if password is invalid
        document.getElementById('change-password-form').addEventListener('submit', function (e) {
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            // If password field has value but validation hasn't passed, prevent submission and focus
            if (newPassword && !passwordValid) {
                e.preventDefault();
                document.getElementById('new_password').focus();

                // Trigger validation check if not already done
                if (!document.getElementById('password-feedback').innerHTML) {
                    document.getElementById('new_password').dispatchEvent(new Event('blur'));
                }
                return;
            }

            // Check if passwords match
            if (newPassword !== confirmPassword) {
                e.preventDefault();
                document.getElementById('confirm_password').focus();
                document.getElementById('confirm_password').dispatchEvent(new Event('blur'));
            }
        });
    </script>
</body>

</html>
